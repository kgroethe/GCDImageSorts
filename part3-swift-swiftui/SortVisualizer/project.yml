name: SortVisualizer
options:
  bundleIdPrefix: com.groethe
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SortCore:
    path: ../SortCore

targets:
  SortsVision:
    type: application
    supportedDestinations: [visionOS]
    sources: [../SortsVision/Sources]
    dependencies:
      - package: SortCore
        product: SortCore
    info:
      path: ../SortsVision/Info.plist
      properties:
        CFBundleDisplayName: Sorts 3D
        UIApplicationSceneManifest:
          # Required: a window plus an ImmersiveSpace is two scenes, and
          # openImmersiveSpace fails with .error without this.
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groethe.sortsvision
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO

  SortVisualizer:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: SortCore
        product: SortCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pixel Sorts
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groethe.sortvisualizer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set DEV_TEAM in the environment before running xcodegen.
        # Keeping the real value out of source means the public mirror and the
        # private repo can carry identical files.
        DEVELOPMENT_TEAM: ${DEV_TEAM}
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
